description = "One Stable Video Diffusion segment (image -> short video). Use with `video-chain` for multi-segment chaining."
required = ["input_image", "checkpoint"]

[defaults]
width = 1024
height = 576
frames = 25
motion_bucket_id = 127
fps = 24
augmentation = 0.0
min_cfg = 1.0
steps = 20
cfg = 2.5
sampler = "euler"
scheduler = "karras"
seed = 0
quality = 90
output_prefix = "svd_segment"
