name: Bug report
description: Something isn't working as expected.
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Before submitting,
        please run `max-comfy doctor` and paste the output below — it answers
        most environment questions in one go.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
      placeholder: e.g. "max-comfy run video-chain crashed with KeyError after segment 3"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: |
        Minimal steps. If possible, paste the workflow JSON or jobs file that
        reproduces it (redact any private paths or prompts you don't want public).
      placeholder: |
        1. Run `max-comfy run video-chain -p ...`
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: false

  - type: textarea
    id: doctor
    attributes:
      label: "`max-comfy doctor` output"
      description: Paste the full output of `max-comfy doctor`.
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: max-comfy-cli version
      description: "Output of `max-comfy --version`"
      placeholder: "0.2.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.12.1"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04 / macOS 14.5 / Windows 11"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / traceback
      description: |
        Re-run with `-vv` for debug output. Paste the relevant traceback or
        ComfyUI server log lines.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
